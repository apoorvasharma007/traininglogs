# A paused shrug is this exercise with the pause logged as tempo. Tempo is four numbers in
# seconds, in the order lowering, pause at the bottom, lifting, pause at the top; X means as fast
# as possible. A shrug held 2 seconds at the top, lifted and lowered in 1 second each, is 1-0-1-2.
- name: Shrug (Cable)
  other_names: [cable paused shrug in, cable shrug, cable shrugs, paused cable shrug]
  equipment: cable
  measures: [weight, reps]
  type: isolation
  primary_muscles: [Upper Traps]
  secondary_muscles: [Forearm Flexors]
  joint_actions: [shoulder blade elevation]
  patterns: []

