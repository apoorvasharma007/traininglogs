# The shared exercise library. Step 3 loads it into the `exercises` table.
# Design and the approved lists: exercise-library-plan.md, sections 1 to 3.
# Studies cited below by author and year are listed in full in ACKNOWLEDGMENTS.md.
#
# Names: movement first, then equipment and variation in brackets, Title Case, no abbreviations:
# "Lat Pulldown (Cable, Wide Grip)".
#
# Fields:
#   name               required
#   other_names        how people write it, lower case; used only to link typed names
#   equipment          required: barbell, ez bar, trap bar, dumbbell, kettlebell, cable, machine,
#                      smith machine, band, medicine ball, sled, box, jump rope, bodyweight, other
#   measures           required, one or more of: weight, reps, time, distance
#   type               compound or isolation
#   primary_muscles    required, one or more; each counts 1 set toward the muscle
#   secondary_muscles  each counts 0.5 sets toward the muscle
#   joint_actions      "<joint> <action>", e.g. "shoulder horizontal adduction"
#   patterns           empty for isolation exercises
#
# Range of motion and pauses are not variations. Bottom-half reps are logged on the full exercise
# as partial reps; a pause is logged as tempo (see Shrug (Cable)).
#
# Grip: Forearm Flexors are listed only where grip commonly limits the set (shrugs, deadlifts,
# carries, hangs), not on every exercise that holds a weight.
#
# Equipment is bodyweight only when nothing is added. Weighted versions ("Pull-up (Weighted)") use
# other, and the logged weight is the added load.

