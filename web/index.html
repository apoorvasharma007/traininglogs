<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>traininglogs — confirm UI</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #111827;
  }
  h1 { font-size: 1.1rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.8rem; color: #6b7280; margin-bottom: 0.25rem; }
  input, textarea {
    width: 100%;
    font: inherit;
    padding: 0.5rem;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    box-sizing: border-box;
  }
  textarea { min-height: 180px; resize: vertical; }
  .row { margin-bottom: 1rem; }
  .config { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
  .config > div { flex: 1; }
  button {
    padding: 0.6rem 1.2rem;
    font: inherit;
    font-weight: 600;
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:disabled { background: #d1d5db; cursor: not-allowed; }
  pre {
    background: #f3f4f6;
    padding: 1rem;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.8rem;
  }
  .status { font-size: 0.85rem; color: #6b7280; margin-bottom: 0.5rem; }
  .error { color: #dc2626; }
</style>
</head>
<body>
  <h1>traininglogs — confirm UI (skeleton)</h1>

  <div class="config">
    <div>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="text" value="http://localhost:8000">
    </div>
    <div>
      <label for="apiKey">X-Api-Key</label>
      <input id="apiKey" type="password">
    </div>
  </div>

  <div class="row">
    <label for="content">What did you do?</label>
    <textarea id="content" placeholder="Paste or type your session notes..."></textarea>
  </div>

  <div class="row">
    <button id="extractBtn">Extract</button>
  </div>

  <div id="status" class="status"></div>
  <pre id="output" style="display:none"></pre>

<script src="app.js"></script>
</body>
</html>
