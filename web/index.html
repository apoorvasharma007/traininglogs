<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>traininglogs — confirm UI</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f9fafb;
    --bg-3: #f3f4f6;
    --ink: #111827;
    --ink-2: #374151;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --red: #dc2626;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --amber-border: #fde68a;
    --green: #15803d;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --f-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 6px;
    --radius-lg: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131417;
      --bg-2: #1b1c20;
      --bg-3: #232427;
      --ink: #f3f4f6;
      --ink-2: #cbd0d8;
      --muted: #9298a3;
      --border: #2c2e33;
      --border-strong: #3a3d43;
      --red: #f0554a;
      --amber: #f0b849;
      --amber-bg: #2a2313;
      --amber-border: #4d3f17;
      --green: #4ade80;
      --green-bg: #132a1c;
      --green-border: #1e4029;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--f-sans);
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(1.25rem, 5vw, 2rem) 1rem 4rem;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: clamp(1.05rem, 3.5vw, 1.3rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 1.5rem;
  }
  h1 .accent { color: var(--red); }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
  input, textarea, select {
    width: 100%;
    font: inherit;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-sizing: border-box;
    background: var(--bg);
    color: var(--ink);
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }
  textarea { min-height: 140px; resize: vertical; font-family: var(--f-sans); }
  .row { margin-bottom: 1rem; }
  .config { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
  .config > div { flex: 1; min-width: 0; }
  @media (max-width: 480px) {
    .config { flex-direction: column; gap: 0.75rem; }
  }
  .btn-primary, .btn-ghost {
    padding: 0.65rem 1.2rem;
    font: inherit;
    font-weight: 600;
    border-radius: 100px;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--red);
    color: #fff;
  }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--ink-2);
    font-weight: 500;
  }
  .btn-primary:disabled, .btn-ghost:disabled { background: var(--border-strong); color: var(--muted); cursor: not-allowed; border-color: transparent; }
  .btn-primary:focus-visible, .btn-ghost:focus-visible, .composer button:focus-visible, .raw-toggle summary:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }
  .error { color: var(--red); }

  /* ---- card ---- */
  #card { display: none; flex-direction: column; gap: 1rem; }
  #card.active { display: flex; }

  .warnings-box {
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: var(--radius);
    padding: 0.75rem 0.9rem;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .warnings-box .w-title {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    margin-bottom: 0.35rem;
  }
  .warnings-box ul { margin: 0; padding-left: 1.1rem; }

  .session-head {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .session-head .focus { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .session-head .meta { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); }
  .sh-flags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.3rem; }

  .movement-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.6rem 0.85rem;
    font-size: 0.82rem;
  }
  .movement-block .m-title {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .movement-row { padding: 0.2rem 0; color: var(--ink-2); }
  .movement-row .m-note { color: var(--muted); font-style: italic; }

  .ex-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .ex-head {
    padding: 0.65rem 0.9rem;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.3rem 0.5rem;
  }
  .ex-head .name { font-weight: 600; font-size: 0.92rem; }
  .ex-head .goal { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); text-align: right; }

  .failed-note {
    margin: 0.85rem;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: var(--radius);
    font-size: 0.82rem;
  }

  .sub-block {
    padding: 0.5rem 0.9rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--ink-2);
  }
  .sub-block .sb-title {
    font-family: var(--f-mono);
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .sub-row { padding: 0.15rem 0; }
  .sub-row .note { color: var(--muted); font-style: italic; }

  .set-row {
    display: grid;
    grid-template-columns: 1.6rem 1fr auto;
    gap: 0.6rem;
    align-items: baseline;
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.86rem;
  }
  .set-row:last-child { border-bottom: none; }
  .set-row .idx { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
  .set-row .vals {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
  }
  .chip {
    font-family: var(--f-mono);
    font-size: 0.72rem;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    background: var(--bg-3);
    color: var(--ink-2);
  }
  .flag {
    font-family: var(--f-mono);
    font-size: 0.68rem;
    padding: 0.12rem 0.45rem;
    border-radius: 4px;
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    color: var(--amber);
    white-space: nowrap;
  }
  .set-row .note { grid-column: 1 / -1; color: var(--muted); font-size: 0.78rem; font-style: italic; }

  .ex-note {
    padding: 0.55rem 0.9rem;
    font-size: 0.8rem;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  /* ---- direct editing (tap a line) ---- */
  [data-path] { cursor: pointer; border-radius: 4px; }
  [data-path]:hover { background: var(--bg-3); }
  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 0.75rem 0.9rem;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    margin: 0.25rem 0;
  }
  .edit-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: 0.6rem; }
  .edit-field.wide { grid-column: 1 / -1; }
  .edit-field label { display: flex; gap: 0.4rem; align-items: center; }
  .edit-field input:not([type="checkbox"]), .edit-field select { min-height: 44px; }
  .edit-field input[type="checkbox"] { width: 22px; height: 22px; margin: 11px 0; }
  .edit-field.uncertain input, .edit-field.uncertain select {
    border-color: var(--amber);
    background: var(--amber-bg);
  }
  .edit-error { color: var(--red); font-size: 0.82rem; min-height: 1em; }
  .edit-error:empty { display: none; }
  .edit-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
  .edit-actions button { min-height: 44px; }
  .edit-hint { font-size: 0.78rem; color: var(--muted); }

  /* ---- repeat a past session ---- */
  .repeat-box { margin-bottom: 1.5rem; }
  .repeat-box summary { cursor: pointer; font-size: 0.85rem; color: var(--ink-2); padding: 0.4rem 0; }
  .repeat-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
  .repeat-item {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 0.6rem;
    align-items: baseline;
    text-align: left;
    font: inherit;
    font-size: 0.82rem;
    padding: 0.6rem 0.8rem;
    min-height: 44px;
    background: var(--bg-2);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .repeat-item:hover { border-color: var(--border-strong); }
  .repeat-item .r-date { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
  .repeat-item .r-focus { font-weight: 600; }
  .repeat-item .r-ex { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 480px) {
    .repeat-item { grid-template-columns: auto 1fr; }
    .repeat-item .r-ex { grid-column: 1 / -1; white-space: normal; }
  }
  .last-time {
    padding: 0.4rem 0.9rem;
    font-size: 0.78rem;
    color: var(--muted);
    font-style: italic;
    border-bottom: 1px dashed var(--border);
  }
  .edit-actions { flex-wrap: wrap; }
  .edit-actions .spacer { flex: 1; }
  .btn-ghost.danger { color: var(--red); border-color: var(--red); }
  .add-row { display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 0.5rem 0.9rem; }
  .btn-small { padding: 0.35rem 0.8rem; font-size: 0.8rem; min-height: 36px; }

  .corrections-log { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 1rem; }
  .corr-row {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    font-size: 0.82rem;
    color: var(--ink-2);
    padding: 0.5rem 0.7rem;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: var(--radius);
  }
  .corr-row .ico { color: var(--green); flex-shrink: 0; font-family: var(--f-mono); font-size: 0.78rem; }

  .composer { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .composer input {
    flex: 1;
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    padding: 0.6rem 1rem;
    font-family: var(--f-sans);
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--ink);
  }
  .composer button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    font-size: 1rem;
  }
  .composer button:disabled { background: var(--border-strong); cursor: not-allowed; }

  .confirm-bar { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }

  #confirmedScreen {
    display: none;
    flex-direction: column;
    gap: 0.6rem;
    align-items: flex-start;
    border: 1px solid var(--green-border);
    background: var(--green-bg);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-top: 1rem;
  }
  #confirmedScreen.active { display: flex; }
  #confirmedScreen .title { font-weight: 700; color: var(--green); font-size: 1.05rem; }
  #confirmedScreen .sid { font-family: var(--f-mono); font-size: 0.8rem; background: var(--bg-3); color: var(--ink-2); padding: 0.35rem 0.7rem; border-radius: var(--radius); }

  .error-box {
    display: none;
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: var(--radius);
    padding: 0.75rem 0.9rem;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-top: 1rem;
  }
  .error-box.active { display: block; }
  .error-box .e-title { font-weight: 700; margin-bottom: 0.2rem; }

  .raw-toggle { margin-top: 1rem; }
  .raw-toggle summary { cursor: pointer; font-size: 0.78rem; color: var(--muted); }
  pre {
    background: var(--bg-3);
    padding: 1rem;
    border-radius: var(--radius);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.76rem;
    margin-top: 0.5rem;
  }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 0.25rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tabs button {
    font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--muted);
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 0.6rem 0.9rem; cursor: pointer; min-height: 44px;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

  /* ---- progress ---- */
  .lift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 0.6rem; }
  .lift-card {
    text-align: left; font: inherit; color: var(--ink); background: var(--bg-2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem 0.85rem;
    cursor: pointer; min-height: 44px; display: flex; flex-direction: column; gap: 0.2rem;
  }
  .lift-card:hover { border-color: var(--border-strong); }
  .lift-card .l-name { font-weight: 600; font-size: 0.9rem; }
  .lift-card .l-value { font-family: var(--f-mono); font-size: 1.15rem; }
  .lift-card .l-meta { font-size: 0.74rem; color: var(--muted); }
  .lift-card.empty .l-value { font-size: 0.8rem; color: var(--muted); font-family: var(--f-sans); }
  .trend-up { color: var(--green); }
  .trend-down { color: var(--red); }
  .trend-flat { color: var(--muted); }
  .other-lifts { margin-top: 1.25rem; }
  .other-lifts summary { cursor: pointer; font-size: 0.85rem; color: var(--ink-2); padding: 0.4rem 0; }
  .other-lifts .lift-grid { margin-top: 0.5rem; }
  #liftDetail h2 { font-size: 1.1rem; margin: 1rem 0 0.25rem; }
  .lift-summary { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 0.75rem; }
  .chart-box { position: relative; height: 16rem; margin-bottom: 0.75rem; }
  .lift-how { font-size: 0.76rem; color: var(--muted); margin-bottom: 1rem; }
  .lift-session { border-top: 1px solid var(--border); padding: 0.6rem 0; font-size: 0.84rem; }
  .lift-session .ls-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
  .lift-session .ls-date { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); }
  .lift-session .ls-value { font-family: var(--f-mono); font-weight: 600; }
  .record { font-family: var(--f-mono); font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 4px;
            background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
</style>
</head>
<body>
  <h1>training<span class="accent">logs</span></h1>

  <div class="config">
    <div>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="text">
    </div>
    <div>
      <label for="apiKey">X-Api-Key</label>
      <input id="apiKey" type="password">
    </div>
  </div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="log" aria-selected="true">Log</button>
    <button type="button" role="tab" data-tab="progress" aria-selected="false">Progress</button>
  </nav>

  <section id="logView">
  <div class="row">
    <label for="content">What did you do?</label>
    <textarea id="content" placeholder="Paste or type your session notes..."></textarea>
  </div>

  <div class="row">
    <button id="extractBtn" class="btn-primary">Extract</button>
  </div>

  <details class="repeat-box">
    <summary>Or repeat a past session</summary>
    <div id="repeatList" class="repeat-list"></div>
  </details>

  <div id="status" class="status"></div>

  <div id="card"></div>

  <div id="correctionsLog" class="corrections-log"></div>

  <div id="composer" class="composer" style="display:none">
    <input type="text" id="corrInput" placeholder="Tell it what to fix…" aria-label="Correction">
    <button id="corrSend" aria-label="Send correction">→</button>
  </div>
  <div id="corrStatus" class="status"></div>

  <div id="confirmBar" class="confirm-bar" style="display:none">
    <button id="editNoteBtn" class="btn-ghost">Edit note</button>
    <button id="confirmBtn" class="btn-primary">Looks good — Confirm</button>
  </div>

  <div id="errorBox" class="error-box">
    <div class="e-title" id="errorTitle"></div>
    <div id="errorDetail"></div>
  </div>

  <div id="confirmedScreen">
    <div class="title">✓ Session saved</div>
    <div class="sid" id="confirmedSid"></div>
    <button id="logAnotherBtn" class="btn-primary">Log another</button>
  </div>

  <details class="raw-toggle">
    <summary>Raw JSON</summary>
    <pre id="output"></pre>
  </details>
  </section>

  <section id="progressView" hidden>
    <div id="progressStatus" class="status"></div>
    <div id="liftList">
      <div class="lift-grid" id="keyLifts"></div>
      <details class="other-lifts">
        <summary>Other lifts</summary>
        <div class="lift-grid" id="otherLifts"></div>
      </details>
    </div>
    <div id="liftDetail" hidden>
      <button type="button" class="btn-ghost btn-small" id="liftBack">← All lifts</button>
      <h2 id="liftTitle"></h2>
      <div class="lift-summary" id="liftSummary"></div>
      <div class="chart-box"><canvas id="liftChart"></canvas></div>
      <div class="lift-how" id="liftHow"></div>
      <div id="liftSessions"></div>
    </div>
  </section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
