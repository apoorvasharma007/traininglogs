[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "traininglogs"
version = "4.1.0"
description = "Parse and process training session logs into structured JSON."
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "groq>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So test files can import the shared helpers in tests/conftest.py (signed-in test users).
pythonpath = ["tests"]
