<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhones ignore SVG icons; without a PNG the home-screen icon is a letter. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale stops Safari zooming in when a small text box is tapped; pinch zoom still works. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <title>Training Logs</title>
    <!-- The name under the icon when added to an iPhone's home screen. -->
    <meta name="apple-mobile-web-app-title" content="Training Logs" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
