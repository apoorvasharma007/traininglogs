name: CI

# Runs on every pull request and every push to main or dev. Pull requests only check. A push, once
# every check passes, deploys (deploy.yml): main to prod, dev to staging.
on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traininglogs_test
          POSTGRES_USER: traininglogs
          POSTGRES_PASSWORD: traininglogs
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://traininglogs:traininglogs@localhost:5433/traininglogs_test
      API_KEY: testkey

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Exactly the versions in the lock file, the same ones the server runs.
      - name: Install
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      # The API serves the built app at /; the tests check that page.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the app
        working-directory: frontend
        run: npm ci && npm run build

      - name: Test
        run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (fails over the size budget)
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # GitHub sign-in to Google (workload identity), for the plan
      pull-requests: write  # post the plan on the pull request

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          # Same version as local runs: Terraform refuses state written by a newer version.
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Validate every layer
        run: |
          for dir in infra/environments/*/*/; do
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

      # Fork pull requests get no sign-in token, so only this repository's own branches plan.
      - name: Sign in to Google Cloud as terraform
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Plan app layer
        id: plan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: infra/environments/prod/app
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan:prod/app -->";
            let plan = fs.readFileSync("infra/environments/prod/app/plan.txt", "utf8");
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = `${marker}\n**Terraform plan — prod / app**\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Keep the app version stamped in docs/design.html in sync with
      # pyproject.toml. The eyebrow contains a stable target span:
      #   App v<span class="app-version">X.Y.Z</span>
      # We rewrite the span's inner text to the current version. If nothing
      # changed, sed is a no-op and we skip the commit. If it did change, we
      # push a small docs-only commit back to main.
      #
      # Safe from loops: a commit pushed with the workflow's own GITHUB_TOKEN never starts new
      # workflow runs, so this bot commit won't re-trigger CI (or CD). No [skip ci] needed.
      - name: Sync app version into design.html
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOC=docs/design.html
          if [ ! -f "$DOC" ]; then
            echo "No $DOC found, skipping sync."
            exit 0
          fi
          sed -i.bak -E "s|(<span class=\"app-version\">)[^<]+(</span>)|\1${VERSION}\2|" "$DOC"
          rm -f "$DOC.bak"
          if git diff --quiet "$DOC"; then
            echo "design.html already at v${VERSION}, no sync needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC"
          git commit -m "chore(docs): sync design.html app version to v${VERSION}"
          git push

      - name: Check if release already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          pip install build
          python -m build

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  deploy:
    needs: [test, frontend, terraform]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
