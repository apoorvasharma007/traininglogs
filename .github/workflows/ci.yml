name: CI
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traininglogs_test
          POSTGRES_USER: traininglogs
          POSTGRES_PASSWORD: traininglogs
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://traininglogs:traininglogs@localhost:5433/traininglogs_test
      API_KEY: testkey

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx

      - name: Test
        run: pytest tests/

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Keep the app version stamped in docs/design.html in sync with
      # pyproject.toml. The eyebrow contains a stable target span:
      #   App v<span class="app-version">X.Y.Z</span>
      # We rewrite the span's inner text to the current version. If nothing
      # changed, sed is a no-op and we skip the commit. If it did change, we
      # push a small docs-only commit back to main.
      #
      # Safe from loops: the workflow's `paths` filter excludes docs/**, so
      # this bot commit will not re-trigger CI. No [skip ci] marker needed.
      - name: Sync app version into design.html
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOC=docs/design.html
          if [ ! -f "$DOC" ]; then
            echo "No $DOC found, skipping sync."
            exit 0
          fi
          sed -i.bak -E "s|(<span class=\"app-version\">)[^<]+(</span>)|\1${VERSION}\2|" "$DOC"
          rm -f "$DOC.bak"
          if git diff --quiet "$DOC"; then
            echo "design.html already at v${VERSION}, no sync needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC"
          git commit -m "chore(docs): sync design.html app version to v${VERSION}"
          git push

      - name: Check if release already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          pip install build
          python -m build

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
