name: CD

# Ships after CI has succeeded on a push: main to prod, dev to staging. First the infrastructure
# (terraform apply on that environment's app layer), then the app (new image onto Cloud Run).
# The job runs in the "prod" or "staging" GitHub environment, which holds that environment's
# variables; prod's waits for Apoorva's approval.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

# One release per environment at a time; a second merge waits for the first instead of racing it.
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/images/traininglogs:${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Sign in to Google Cloud as terraform
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      # Plan, then apply exactly that plan. With no infra/ changes this is a no-op that also
      # catches anything changed by hand in the console.
      - name: Plan and apply app layer
        working-directory: infra/environments/${{ env.ENVIRONMENT }}/app
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform apply -input=false -no-color -lock-timeout=120s tfplan

      # app-deploy can only be used from the environment's branch (the workload identity grant
      # checks it): main for prod, dev for staging.
      - name: Sign in to Google Cloud as app-deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Changes only the image; every other setting stays as Terraform defines it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy traininglogs --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
