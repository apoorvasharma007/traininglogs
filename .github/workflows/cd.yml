name: CD

# Ships prod, only after CI has succeeded on main: first the infrastructure (terraform apply on
# the app layer), then the app (new image onto Cloud Run). The infra job runs in the "prod"
# GitHub environment, so it waits for Apoorva's approval; the app job runs only after it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One release at a time; a second merge waits for the first to finish instead of racing it.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  infra:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Sign in to Google Cloud as terraform
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      # Plan, then apply exactly that plan. With no infra/ changes this is a no-op that also
      # catches anything changed by hand in the console.
      - name: Plan and apply app layer
        working-directory: infra/environments/prod/app
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform apply -input=false -no-color -lock-timeout=120s tfplan

  app:
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/images/traininglogs:${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # app-deploy can only be used from main (the workload identity grant checks the branch).
      - name: Sign in to Google Cloud as app-deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Changes only the image; every other setting stays as Terraform defines it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy traininglogs --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
